<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Earn Money Bot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Ads -->
<script src="//libtl.com/sdk.js" data-zone="10390731" data-sdk="show_10390731"></script>
<script src="https://adexora.com/cdn/ads.js?id=1551"></script>

<style>
body{margin:0;font-family:Arial;background:#f6f7fb}
.header{background:#ff4fa3;color:#fff;padding:18px;text-align:center;font-size:20px}
.card{background:#fff;border-radius:12px;padding:15px;margin:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.balance{font-size:28px;font-weight:bold;text-align:center}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;color:#fff;margin-top:10px}
.btn-m{background:#3f5bd8}
.btn-a{background:#9c27b0}
.btn-w{background:#28a745}
.nav{position:fixed;bottom:0;left:0;width:100%;display:flex;background:#ff4fa3}
.nav button{flex:1;padding:12px;border:none;background:none;color:#fff}
.hide{display:none}
input,select{width:100%;padding:10px;margin-top:8px}
.toast{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#d32f2f;color:#fff;padding:10px 18px;border-radius:20px;z-index:999}
</style>
</head>

<body>

<div class="toast" id="toast"></div>

<div class="header">💰 Earn Money Bot</div>

<div class="card">
  <div class="balance" id="balance">0.00 ৳</div>
  <div style="text-align:center">Total Balance</div>
</div>

<div class="card">
  <button class="btn btn-m" onclick="watchMonetag()">📺 Watch Ad (Monetag)</button>
  <button class="btn btn-a" onclick="watchAdexora()">📺 Watch Ad (Adexora)</button>
</div>

<div class="card">
  <select id="method">
    <option>Bkash</option>
    <option>Nagad</option>
  </select>
  <input id="number" placeholder="Payment Number">
  <select id="amount">
    <option value="">Withdraw Amount</option>
    <option value="20">20</option>
    <option value="50">50</option>
    <option value="100">100</option>
    <option value="200">200</option>
  </select>
  <button class="btn btn-w" onclick="withdraw()">Submit Withdraw</button>
</div>

<div class="nav">
  <button onclick="showToast('Earn Section',true)">Home</button>
  <button onclick="showToast('Watch Ads',true)">Earn</button>
  <button onclick="showToast('Withdraw Section',true)">Withdraw</button>
</div>

<script type="module">
/* 🔥 FIREBASE */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getDatabase, ref, get, set, update, push }
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyDYOXUgRTU9hFyQMR2o9FJupg8DwRpvTBA",
 authDomain: "telegram-bot-system-133d4.firebaseapp.com",
 databaseURL: "https://telegram-bot-system-133d4-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "telegram-bot-system-133d4",
 storageBucket: "telegram-bot-system-133d4.appspot.com",
 messagingSenderId: "367398716302",
 appId: "1:367398716302:web:43e91f145277f50313dadf"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 👤 USER */
const UID = localStorage.getItem("uid") || Date.now().toString();
localStorage.setItem("uid", UID);
const userRef = ref(db,"users/"+UID);

let balance = 0;
let reward = 0;

/* LOAD DATA */
async function loadUser(){
 const s = await get(userRef);
 if(!s.exists()){
  set(userRef,{balance:0,banned:false});
  balance = 0;
 }else{
  balance = s.val().balance || 0;
 }
 document.getElementById("balance").innerText = balance.toFixed(2)+" ৳";
}
loadUser();

/* SETTINGS */
async function loadSettings(){
 const s = await get(ref(db,"settings/adReward"));
 reward = s.val()?.amount || 0.05;
}
loadSettings();

/* ADS */
function watchMonetag(){
 show_10390731().then(()=>{
  setTimeout(addReward,18000);
 });
}
function watchAdexora(){
 showAdexora().then(()=>{
  setTimeout(addReward,18000);
 });
}
async function addReward(){
 balance += reward;
 update(userRef,{balance});
 document.getElementById("balance").innerText = balance.toFixed(2)+" ৳";
}

/* WITHDRAW */
async function withdraw(){
 const amt = Number(amount.value);
 if(!amt || balance < amt) return toast("❌ Balance কম");
 if(!number.value) return toast("❌ নাম্বার দিন");

 balance -= amt;
 update(userRef,{balance});

 push(ref(db,"withdraws"),{
  uid:UID,
  method:method.value,
  amount:amt,
  status:"pending"
 });

 document.getElementById("balance").innerText = balance.toFixed(2)+" ৳";
 toast("✅ Withdraw Submitted",true);
}

/* TOAST */
function toast(msg,ok=false){
 const t=document.getElementById("toast");
 t.innerText=msg;
 t.style.background=ok?"#2e7d32":"#d32f2f";
 t.style.display="block";
 setTimeout(()=>t.style.display="none",2500);
}
window.showToast=toast;
</script>

</body>
</html>
