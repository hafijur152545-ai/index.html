<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn Money Bot</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri&display=swap" rel="stylesheet">

<script src="//libtl.com/sdk.js" data-zone="10390731" data-sdk="show_10390731"></script>
<script src="https://adexora.com/cdn/ads.js?id=1551"></script>

<style>
body{
  font-family:'Hind Siliguri',sans-serif;
  margin:0;
  background:#f4f6fb;
}
.header{
  background:linear-gradient(90deg,#ff4fa3,#8e44ad);
  color:#fff;
  padding:20px;
  text-align:center;
}
.card{
  background:#fff;
  margin:15px;
  padding:15px;
  border-radius:12px;
}
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:16px;
  color:#fff;
  margin-top:10px;
}
.pink{background:#ff4fa3}
.purple{background:#8e44ad}
input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}
.notice{
  background:#fff3cd;
  padding:12px;
  border-radius:10px;
  margin:15px;
}
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#fff;
  border-top:1px solid #ddd;
}
.nav button{
  flex:1;
  padding:12px;
  border:none;
  background:#fff;
  font-size:15px;
}
.hide{display:none}
</style>
</head>

<body>

<div class="header">
  💰 Earn Money Bot  
  <h2>Balance: <span id="balance">21</span> ৳</h2>
</div>

<div id="home">
  <div class="notice">📢 নিয়ম মেনে কাজ করলে ১০০% পেমেন্ট নিশ্চিত</div>

  <div class="card">
    <h3>Referral Program</h3>
    <p>১০% কমিশন পাবেন</p>
    <input value="https://t.me/Maniriyelbot?start=12345" readonly>
    <button class="btn pink">Copy Referral</button>
  </div>

  <div class="card">
    <button class="btn purple">🎧 Support</button>
    <button class="btn pink">📢 Update Group</button>
  </div>
</div>

<div id="withdraw" class="hide">
  <div class="card">
    <h3>Withdraw</h3>
    <input id="amount" type="number" placeholder="Withdraw Amount">
    <button class="btn pink" onclick="withdraw()">Withdraw Now</button>
  </div>
</div>

<div id="history" class="hide">
  <div class="card">
    <h3>Withdraw History</h3>
    <ul id="historyList"></ul>
  </div>
</div>

<div class="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('withdraw')">Withdraw</button>
  <button onclick="show('history')">History</button>
</div>

<script>
let balance = 21;
const minWithdraw = 50;

function show(id){
  home.classList.add('hide');
  withdraw.classList.add('hide');
  history.classList.add('hide');
  document.getElementById(id).classList.remove('hide');
}

function withdraw(){
  const amt = Number(document.getElementById('amount').value);

  if(amt <= 0){
    alert("সঠিক পরিমাণ লিখুন");
    return;
  }

  if(amt > balance){
    alert("❌ আপনার পর্যাপ্ত ব্যালেন্স নেই");
    return;
  }

  if(amt < minWithdraw){
    alert("❌ মিনিমাম Withdraw ৫০ টাকা");
    return;
  }

  balance -= amt;
  document.getElementById('balance').innerText = balance;

  alert("✅ Success! আপনার Withdraw Pending হয়েছে");

  const li = document.createElement("li");
  li.innerText = amt + " ৳ - Pending";
  document.getElementById("historyList").appendChild(li);

  document.getElementById('amount').value = "";
}
</script>

</body>
</html>
