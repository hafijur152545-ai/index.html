<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Earn Money Bot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f2f3f7;margin:0}
.header{background:#ff4fa3;color:#fff;padding:15px;text-align:center;font-size:20px}
.card{background:#fff;margin:12px;padding:15px;border-radius:12px;text-align:center}
.btn{background:#ff4fa3;color:#fff;border:none;padding:12px;width:100%;border-radius:8px;font-size:16px;margin-top:10px}
.btn:disabled{background:#aaa}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex}
.nav button{flex:1;border:none;padding:14px;font-size:16px}
</style>
</head>

<body>

<div class="header">💰 Earn Money Bot</div>

<div class="card">
<h3>Balance</h3>
<h1 id="balance">0 ৳</h1>
</div>

<div class="card">
<button class="btn" id="adBtn">🎥 Watch Ad</button>
<p id="adStatus"></p>
</div>

<div class="card">
<input id="withdrawAmount" type="number" placeholder="Withdraw Amount">
<button class="btn" id="withdrawBtn">💸 Withdraw</button>
<p id="withdrawStatus"></p>
</div>

<div class="nav">
<button>Home</button>
<button>Earn</button>
<button>Withdraw</button>
</div>

<script type="module">
/* 🔥 TELEGRAM USER ID */
const tg = window.Telegram.WebApp;
tg.ready();
const uid = String(tg.initDataUnsafe.user.id);

/* 🔥 FIREBASE */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
 getDatabase, ref, onValue, get, update, push
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyDYOXUgRTU9hFyQMR2o9FJupg8DwRpvTBA",
 authDomain: "telegram-bot-system-133d4.firebaseapp.com",
 databaseURL: "https://telegram-bot-system-133d4-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "telegram-bot-system-133d4",
 storageBucket: "telegram-bot-system-133d4.appspot.com",
 messagingSenderId: "367398716302",
 appId: "1:367398716302:web:43e91f145277f50313dadf"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 🔒 BOT STATUS */
onValue(ref(db,"settings/bot"),s=>{
 if(s.val()==="off"){
  document.body.innerHTML="<h2 style='text-align:center;margin-top:100px'>🚫 Bot is OFF</h2>";
 }
});

/* 👤 USER INIT */
const userRef = ref(db,"users/"+uid);
get(userRef).then(s=>{
 if(!s.exists()){
  update(userRef,{balance:0,banned:false});
 }
});

/* 🚫 BAN CHECK */
onValue(ref(db,"users/"+uid+"/banned"),s=>{
 if(s.val()===true){
  document.body.innerHTML="<h2 style='text-align:center;margin-top:100px'>🚫 You are banned</h2>";
 }
});

/* 💰 BALANCE */
onValue(ref(db,"users/"+uid+"/balance"),s=>{
 balance.innerText=(s.val()||0)+" ৳";
});

/* 📢 AD */
let adAmount=0, adOn=false;
onValue(ref(db,"settings/adReward"),s=>{
 const d=s.val()||{};
 adAmount=d.amount||0;
 adOn=d.status==="on";
 adBtn.disabled=!adOn;
 adStatus.innerText=adOn?"Reward: "+adAmount+"৳":"Ads OFF";
});

adBtn.onclick=async()=>{
 if(!adOn)return;
 const balSnap=await get(ref(db,"users/"+uid+"/balance"));
 const bal=balSnap.val()||0;
 update(ref(db,"users/"+uid),{balance:bal+adAmount});
};

/* 💸 WITHDRAW */
let minWithdraw=0;
onValue(ref(db,"settings/minWithdraw"),s=>minWithdraw=s.val()||0);

withdrawBtn.onclick=async()=>{
 const amt=Number(withdrawAmount.value);
 const bal=(await get(ref(db,"users/"+uid+"/balance"))).val()||0;
 if(amt<minWithdraw){withdrawStatus.innerText="❌ Min "+minWithdraw+"৳";return;}
 if(amt>bal){withdrawStatus.innerText="❌ Insufficient balance";return;}

 await push(ref(db,"withdraws"),{
  uid, amount:amt, status:"pending"
 });
 update(ref(db,"users/"+uid),{balance:bal-amt});
 withdrawStatus.innerText="✅ Request sent";
};
</script>

</body>
</html>
