<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Earn Money Bot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

<script src="//libtl.com/sdk.js" data-zone="10390731" data-sdk="show_10390731"></script>
<script src="https://adexora.com/cdn/ads.js?id=1551"></script>

<style>
body{margin:0;font-family:'Hind Siliguri',sans-serif;background:#f5f6fa}
.header{background:linear-gradient(90deg,#ff4fa3,#8e44ad);color:#fff;padding:15px;text-align:center;font-weight:700}
.balance{font-size:22px}
.page{display:none;padding:15px}
.page.active{display:block}
.card{background:#fff;padding:15px;border-radius:14px;margin-bottom:12px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700}
.btn-pink{background:#ff4fa3;color:#fff}
.btn-purple{background:#8e44ad;color:#fff}
.nav{position:fixed;bottom:0;left:0;width:100%;display:flex;background:#fff;border-top:1px solid #ddd}
.nav button{flex:1;padding:10px;border:none;background:none;font-weight:700}
.nav button.active{color:#ff4fa3}
.small{font-size:12px;color:#555}
</style>
</head>

<body>

<div class="header">
 💰 Earn Money Bot<br>
 <span class="balance">Balance: <span id="bal">0</span> ৳</span>
</div>

<!-- HOME -->
<div id="home" class="page active">
 <div class="card">📢 নিয়ম মেনে কাজ করলে ১০০% পেমেন্ট নিশ্চিত</div>

 <div class="card">
 <b>Referral Program</b><br>
 ১০% কমিশন পান<br><br>
 <input id="reflink" readonly style="width:100%;padding:8px">
 <button class="btn btn-pink" onclick="copyRef()">Copy Referral</button>
 </div>
</div>

<!-- EARN -->
<div id="earn" class="page">
 <div class="card">
 <button class="btn btn-purple" onclick="watchMonetag()">📺 Watch Ad (Monetag)</button><br><br>
 <button class="btn btn-pink" onclick="watchAdexora()">📺 Watch Ad (Adexora)</button>
 </div>

 <div class="card small">আজকে দেখেছেন: <span id="watched">0</span> / <span id="limit">0</span></div>
 <div class="card small" id="ruleText"></div>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="page">
 <div class="card">
 <select id="method" style="width:100%;padding:10px">
 <option>Bkash</option>
 <option>Nagad</option>
 </select><br><br>

 <input id="number" placeholder="Payment Number" style="width:100%;padding:10px"><br><br>

 <select id="amount" style="width:100%;padding:10px">
 <option value="50">50</option>
 <option value="100">100</option>
 <option value="200">200</option>
 </select><br><br>

 <button class="btn btn-pink" onclick="withdraw()">Withdraw</button>
 </div>
</div>

<div class="nav">
 <button onclick="show('home')" class="active">Home</button>
 <button onclick="show('earn')">Earn</button>
 <button onclick="show('withdraw')">Withdraw</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getDatabase, ref, get, set, update, push, onValue } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyDYOXUgRTU9hFyQMR2o9FJupg8DwRpvTBA",
 authDomain: "telegram-bot-system-133d4.firebaseapp.com",
 databaseURL: "https://telegram-bot-system-133d4-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "telegram-bot-system-133d4",
 storageBucket: "telegram-bot-system-133d4.appspot.com",
 messagingSenderId: "367398716302",
 appId: "1:367398716302:web:43e91f145277f50313dadf"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const uid = localStorage.getItem("uid") || Date.now().toString();
localStorage.setItem("uid", uid);

const userRef = ref(db,"users/"+uid);
const settingsRef = ref(db,"settings");

let DAILY_LIMIT = 0;
let AD_REWARD = 0;

onValue(settingsRef,(s)=>{
 if(s.exists()){
  DAILY_LIMIT = Number(s.val().dailyAdLimit);
  AD_REWARD = Number(s.val().adReward);

  document.getElementById("limit").innerText = DAILY_LIMIT;
  document.getElementById("ruleText").innerText =
   `নিয়ম: প্রতিদিন ${DAILY_LIMIT}টা এড দেখতে পারবেন। প্রতি এডে ${AD_REWARD}৳ পাবেন।`;
 }
});

const snap = await get(userRef);
if(!snap.exists()){
 await set(userRef,{balance:0,ads:0});
}

onValue(userRef,s=>{
 document.getElementById("bal").innerText = s.val().balance || 0;
 document.getElementById("watched").innerText = s.val().ads || 0;
});

window.watchMonetag=()=>{
 show_10390731();
 setTimeout(addBalance,20000);
}

window.watchAdexora=()=>{
 showAdexora();
 setTimeout(addBalance,20000);
}

async function addBalance(){
 const s = await get(userRef);
 if((s.val().ads||0)>=DAILY_LIMIT){
  alert("❌ আজকের লিমিট শেষ");
  return;
 }
 await update(userRef,{
  balance:(s.val().balance||0)+AD_REWARD,
  ads:(s.val().ads||0)+1
 });
 alert("✅ Success! ব্যালেন্স যোগ হয়েছে");
}

window.withdraw=async()=>{
 const amt = Number(amount.value);
 const s = await get(userRef);
 if(s.val().balance < amt){
  alert("❌ পর্যাপ্ত ব্যালেন্স নেই");
  return;
 }
 await update(userRef,{balance:s.val().balance-amt});
 await push(ref(db,"withdraws"),{
  uid,amount:amt,method:method.value,status:"pending",time:Date.now()
 });
 alert("✅ Withdraw Pending");
}

window.show=(id)=>{
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
