<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Earn Money Bot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Ads -->
<script src="//libtl.com/sdk.js" data-zone="10390731" data-sdk="show_10390731"></script>
<script src="https://adexora.com/cdn/ads.js?id=1551"></script>

<style>
body{margin:0;font-family:Arial;background:#f6f7fb;}
.header{background:#ff4fa3;color:#fff;padding:18px;text-align:center;font-size:20px;}
.fixed-balance{background:#fff;margin:10px;padding:10px;border-radius:10px;text-align:center;font-weight:bold;}
.container{padding:15px;}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.balance{font-size:28px;font-weight:bold;text-align:center;}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;color:#fff;margin-top:10px;}
.btn-monetag{background:#3f5bd8;}
.btn-adexora{background:#9c27b0;}
.btn-withdraw{background:#28a745;}
.info{text-align:center;font-size:14px;margin-top:6px;}
.small{font-size:12px;color:#555;text-align:center;}
.nav{position:fixed;bottom:0;left:0;width:100%;display:flex;background:#ff4fa3;}
.nav button{flex:1;padding:12px;border:none;background:none;color:#fff;}
.hide{display:none;}
input,select{width:100%;padding:10px;margin-top:8px;}
.toast{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#d32f2f;color:#fff;padding:10px 18px;border-radius:20px;z-index:999;}
.row{display:flex;gap:10px;}
</style>
</head>

<body>

<div class="toast" id="toast"></div>

<div class="header">💰 Earn Money Bot</div>
<div class="fixed-balance">Balance: <span id="balanceFixed">0.00</span> ৳</div>

<!-- HOME -->
<div class="container" id="home">
  <div class="card">
    <div class="balance" id="balance">0.00 ৳</div>
    <div style="text-align:center;">Total Balance</div>
  </div>
</div>

<!-- EARN -->
<div class="container hide" id="earn">
  <div class="card">
    <div class="balance" id="balance2">0.00 ৳</div>
  </div>

  <div class="card">
    <button class="btn btn-monetag" onclick="watchMonetag()">📺 Watch Ad (Monetag)</button>
    <div class="info">দেখা হয়েছে: <span id="mSeen">0</span></div>

    <button class="btn btn-adexora" onclick="watchAdexora()">📺 Watch Ad (Adexora)</button>
    <div class="info">দেখা হয়েছে: <span id="aSeen">0</span></div>
  </div>
</div>

<!-- WITHDRAW -->
<div class="container hide" id="withdraw">
  <div class="card">
    <select id="method">
      <option>Bkash</option>
      <option>Nagad</option>
    </select>
    <input id="number" placeholder="Payment Number">
    <select id="amount">
      <option value="">Withdraw Amount</option>
      <option>20</option>
      <option>50</option>
      <option>100</option>
      <option>200</option>
    </select>
    <button class="btn btn-withdraw" onclick="withdraw()">Submit Withdraw</button>
  </div>
</div>

<div class="nav">
  <button onclick="showTab('home')">Home</button>
  <button onclick="showTab('earn')">Earn</button>
  <button onclick="showTab('withdraw')">Withdraw</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getDatabase, ref, get, set, update, push } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyDYOXUgRTU9hFyQMR2o9FJupg8DwRpvTBA",
 authDomain: "telegram-bot-system-133d4.firebaseapp.com",
 databaseURL: "https://telegram-bot-system-133d4-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "telegram-bot-system-133d4",
 storageBucket: "telegram-bot-system-133d4.appspot.com",
 messagingSenderId: "367398716302",
 appId: "1:367398716302:web:43e91f145277f50313dadf"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const uid = localStorage.getItem("uid") || Date.now().toString();
localStorage.setItem("uid", uid);

let reward = 0;
let balance = 0;

async function loadUser(){
 const s = await get(ref(db,"users/"+uid));
 if(!s.exists()){
  set(ref(db,"users/"+uid),{balance:0});
  balance = 0;
 } else {
  balance = s.val().balance || 0;
 }
 updateUI();
}
loadUser();

async function loadSettings(){
 const s = await get(ref(db,"settings"));
 if(s.exists()){
  reward = s.val().adReward?.amount || 0;
 }
}
loadSettings();

function updateUI(){
 balanceFixed.innerText = balance.toFixed(2);
 balance.innerText = balance.toFixed(2)+" ৳";
 balance2.innerText = balance.toFixed(2)+" ৳";
}

function watchMonetag(){
 show_10390731().then(()=>{
  setTimeout(async()=>{
   balance += reward;
   await update(ref(db,"users/"+uid),{balance});
   updateUI();
  },18000);
 });
}

function watchAdexora(){
 showAdexora().then(()=>{
  setTimeout(async()=>{
   balance += reward;
   await update(ref(db,"users/"+uid),{balance});
   updateUI();
  },18000);
 });
}

async function withdraw(){
 const amt = Number(amount.value);
 const s = await get(ref(db,"settings/minWithdraw"));
 const min = s.val() || 0;
 if(amt < min) return alert("Minimum withdraw "+min+"৳");
 if(balance < amt) return alert("Insufficient balance");

 balance -= amt;
 await update(ref(db,"users/"+uid),{balance});
 await push(ref(db,"withdraws"),{
  uid, amount:amt, method:method.value, number:number.value, status:"pending"
 });
 updateUI();
 alert("Withdraw submitted");
}

function showTab(id){
 ["home","earn","withdraw"].forEach(x=>document.getElementById(x).classList.add("hide"));
 document.getElementById(id).classList.remove("hide");
}
</script>

</body>
</html>
