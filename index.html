<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Earn Money Bot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Ads -->
<script src="//libtl.com/sdk.js" data-zone="10390731" data-sdk="show_10390731"></script>
<script src="https://adexora.com/cdn/ads.js?id=1551"></script>

<style>
body{margin:0;font-family:Arial;background:#f6f7fb}
.header{background:#ff4fa3;color:#fff;padding:18px;text-align:center;font-size:20px}
.card{background:#fff;margin:12px;padding:15px;border-radius:12px}
.balance{font-size:28px;font-weight:bold;text-align:center}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;color:#fff;margin-top:10px}
.btn-m{background:#3f5bd8}
.btn-a{background:#9c27b0}
.btn-w{background:#28a745}
.nav{position:fixed;bottom:0;left:0;width:100%;display:flex;background:#ff4fa3}
.nav button{flex:1;padding:12px;border:none;background:none;color:#fff}
input,select{width:100%;padding:10px;margin-top:8px}
.small{font-size:13px;color:#555;text-align:center}
</style>
</head>

<body>

<div class="header">💰 Earn Money Bot</div>

<div class="card">
  <div class="balance" id="bal">0.00 ৳</div>
  <div class="small">Total Balance</div>
</div>

<div class="card">
  <button class="btn btn-m" onclick="watchMonetag()">📺 Watch Ad (Monetag)</button>
  <button class="btn btn-a" onclick="watchAdexora()">📺 Watch Ad (Adexora)</button>
</div>

<div class="card">
  <select id="method">
    <option>Bkash</option>
    <option>Nagad</option>
  </select>
  <input id="number" placeholder="Payment Number">
  <select id="amount">
    <option value="">Withdraw Amount</option>
    <option value="50">50</option>
    <option value="100">100</option>
    <option value="150">150</option>
    <option value="200">200</option>
  </select>
  <button class="btn btn-w" onclick="withdraw()">Withdraw</button>
</div>

<div class="nav">
  <button onclick="location.reload()">Home</button>
  <button onclick="copyRef()">Referral</button>
</div>

<script type="module">
/* 🔥 FIREBASE */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getDatabase, ref, get, set, update, push, onValue }
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyDYOXUgRTU9hFyQMR2o9FJupg8DwRpvTBA",
 authDomain: "telegram-bot-system-133d4.firebaseapp.com",
 databaseURL: "https://telegram-bot-system-133d4-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "telegram-bot-system-133d4",
 storageBucket: "telegram-bot-system-133d4.appspot.com",
 messagingSenderId: "367398716302",
 appId: "1:367398716302:web:43e91f145277f50313dadf"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* 👤 USER */
const uid = localStorage.getItem("uid") || Date.now().toString();
localStorage.setItem("uid", uid);
const userRef = ref(db, "users/" + uid);

const snap = await get(userRef);
if(!snap.exists()){
  await set(userRef,{ balance:0, banned:false });
}

/* LIVE BALANCE */
onValue(userRef,s=>{
 if(s.val()?.banned){
  document.body.innerHTML="<h2 style='text-align:center;margin-top:80px'>🚫 You are banned</h2>";
  return;
 }
 document.getElementById("bal").innerText =
  (s.val()?.balance || 0).toFixed(2)+" ৳";
});

/* SETTINGS */
let adReward = 1;
let minWithdraw = 50;

onValue(ref(db,"settings/adReward"),s=>{
 adReward = s.val()?.amount || 1;
});
onValue(ref(db,"settings/minWithdraw"),s=>{
 minWithdraw = s.val() || 50;
});

/* 🔥 ADS – FIXED */
window.watchMonetag = ()=>{
 show_10390731();
 setTimeout(addBalance, 15000);
};

window.watchAdexora = ()=>{
 showAdexora();
 setTimeout(addBalance, 15000);
};

async function addBalance(){
 const s = await get(userRef);
 await update(userRef,{
  balance:(s.val().balance || 0) + adReward
 });
}

/* 💸 WITHDRAW */
window.withdraw = async()=>{
 const amt = Number(amount.value);
 if(!amt || amt < minWithdraw){
  alert("Minimum " + minWithdraw + "৳");
  return;
 }
 const s = await get(userRef);
 if(s.val().balance < amt){
  alert("Insufficient balance");
  return;
 }

 await update(userRef,{ balance:s.val().balance - amt });
 await push(ref(db,"withdraws"),{
  uid, amount:amt, method:method.value, status:"pending"
 });
 alert("Withdraw Submitted");
};

/* 🔗 REF */
window.copyRef = ()=>{
 const link = "https://t.me/YOUR_BOT_USERNAME?start=" + uid;
 navigator.clipboard.writeText(link);
 alert("Referral copied");
};
</script>

</body>
</html>
